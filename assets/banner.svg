<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#111726" />
    </linearGradient>

    <!-- Glow Accent Gradients -->
    <radialGradient id="cyanGlow" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="50%" cy="100%" r="40%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.6" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 2px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.8px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#gridPattern)" />
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#cyanGlow)" />
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#purpleGlow)" />
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#emeraldGlow)" />

  <!-- Top Bar Decor -->
  <g transform="translate(26, 22)">
    <circle cx="6" cy="6" r="4.5" fill="#f43f5e" />
    <circle cx="20" cy="6" r="4.5" fill="#eab308" />
    <circle cx="34" cy="6" r="4.5" fill="#10b981" />
    <polyline points="48 2 54 6 48 10" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="58" y1="10" x2="66" y2="10" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    <text x="74" y="6" dominant-baseline="central" font-family="ui-monospace, monospace" font-size="11" fill="#64748b" font-weight="600">
      ENV // LOCAL-FIRST INTELLIGENCE
    </text>
  </g>

  <!-- Status Chip Top Right (Precise Alignment & Width) -->
  <g transform="translate(702, 17)">
    <rect width="172" height="28" rx="14" fill="#04231b" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="18" cy="14" r="4" fill="#34d399" />
    <circle cx="18" cy="14" r="7" fill="none" stroke="#34d399" stroke-width="1">
      <animate attributeName="r" values="4;8;4" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="14" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.8px" fill="#6ee7b7">
      AVAILABLE FOR WORK
    </text>
  </g>

  <!-- Main Content -->
  <g transform="translate(36, 92)">
    <!-- Main Name -->
    <text x="0" y="28" class="title">ARAE MAHESA ARMERA</text>

    <!-- Subtitle -->
    <text x="2" y="58" class="subtitle">
      Autonomous AI Agent Systems • High-Performance Web &amp; Desktop Engineering
    </text>

    <!-- Feature Chips (Pure Vector Icons, Zero Emojis) -->
    <g transform="translate(2, 80)">
      <!-- Chip 1: Multi-Agent DAGs -->
      <g transform="translate(0, 0)">
        <rect width="176" height="30" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
        <polygon points="5 0 0 6.5 4 6.5 3 11 9 4.5 5 4.5 5 0" fill="#38bdf8" transform="translate(14, 9.5)" />
        <text x="30" y="15" dominant-baseline="central" fill="#38bdf8" class="badge-text">MULTI-AGENT DAGs</text>
      </g>

      <!-- Chip 2: Zero-Trust MCP -->
      <g transform="translate(188, 0)">
        <rect width="168" height="30" rx="8" fill="#111827" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
        <path d="M5.5 11s4.5-2.2 4.5-5.5V2.3L5.5 0.8 1 2.3v3.2c0 3.3 4.5 5.5 4.5 5.5z" fill="none" stroke="#818cf8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" transform="translate(14, 9.5)" />
        <text x="30" y="15" dominant-baseline="central" fill="#a5b4fc" class="badge-text">ZERO-TRUST MCP</text>
      </g>

      <!-- Chip 3: Full-Stack Architect -->
      <g transform="translate(368, 0)">
        <rect width="202" height="30" rx="8" fill="#111827" stroke="#34d399" stroke-width="1" stroke-opacity="0.4" />
        <g transform="translate(14, 9.5)">
          <polygon points="5.5 0 1 2.2 5.5 4.5 10 2.2 5.5 0" fill="none" stroke="#34d399" stroke-width="1.2" />
          <polyline points="1 4.5 5.5 6.8 10 4.5" fill="none" stroke="#34d399" stroke-width="1.2" />
          <polyline points="1 6.8 5.5 9 10 6.8" fill="none" stroke="#34d399" stroke-width="1.2" />
        </g>
        <text x="30" y="15" dominant-baseline="central" fill="#6ee7b7" class="badge-text">FULL-STACK ARCHITECT</text>
      </g>
    </g>
  </g>
</svg>
