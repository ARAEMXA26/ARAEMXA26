<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#121824" />
    </linearGradient>

    <!-- Glow Accent Gradients -->
    <radialGradient id="cyanGlow" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="50%" cy="100%" r="40%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.6" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 2px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 1px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .terminal-dot {
      transition: opacity 0.3s ease;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#gridPattern)" />
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#cyanGlow)" />
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#purpleGlow)" />
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#emeraldGlow)" />

  <!-- Top Bar Decor -->
  <g transform="translate(24, 22)">
    <circle cx="6" cy="6" r="5" fill="#f43f5e" class="terminal-dot" />
    <circle cx="22" cy="6" r="5" fill="#eab308" class="terminal-dot" />
    <circle cx="38" cy="6" r="5" fill="#10b981" class="terminal-dot" />
    <text x="60" y="10" font-family="ui-monospace, monospace" font-size="11" fill="#64748b" font-weight="600">
      ENV // LOCAL-FIRST INTELLIGENCE
    </text>
  </g>

  <!-- Status Chip Top Right -->
  <g transform="translate(735, 18)">
    <rect width="140" height="24" rx="12" fill="#032b1f" stroke="#059669" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="16" cy="12" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="16" font-family="ui-monospace, monospace" font-size="10.5" fill="#6ee7b7" font-weight="600">
      AVAILABLE FOR WORK
    </text>
  </g>

  <!-- Main Content -->
  <g transform="translate(36, 92)">
    <!-- Main Name -->
    <text x="0" y="28" class="title">ARAE MAHESA ARMERA</text>

    <!-- Subtitle -->
    <text x="2" y="58" class="subtitle">
      Autonomous AI Agent Systems • High-Performance Web &amp; Desktop Engineering
    </text>

    <!-- Feature Chips -->
    <g transform="translate(2, 80)">
      <!-- Chip 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
        <text x="14" y="18" fill="#38bdf8" class="badge-text">⚡ MULTI-AGENT DAGs</text>
      </g>
      <!-- Chip 2 -->
      <g transform="translate(192, 0)">
        <rect width="170" height="28" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.3" />
        <text x="14" y="18" fill="#a5b4fc" class="badge-text">🛡️ ZERO-TRUST MCP</text>
      </g>
      <!-- Chip 3 -->
      <g transform="translate(374, 0)">
        <rect width="210" height="28" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1" stroke-opacity="0.3" />
        <text x="14" y="18" fill="#6ee7b7" class="badge-text">🚀 FULL-STACK ARCHITECT</text>
      </g>
    </g>
  </g>
</svg>
