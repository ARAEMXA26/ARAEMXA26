<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 185" width="100%" height="185">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d131f" />
      <stop offset="50%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Card Background with Hairline Border -->
  <rect x="1.5" y="1.5" width="427" height="182" rx="12" fill="url(#cardBg)" stroke="url(#borderGlow)" stroke-width="1.2" />

  <!-- Top Icon -->
  <g transform="translate(24, 20)">
          <rect width="36" height="36" rx="10" fill="#0b192e" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
          <polyline points="13 22 17 18 13 14" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <line x1="19" y1="22" x2="23" y2="22" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
        </g>

  <!-- Category Monospace Tag -->
  <text x="70" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1px" fill="#38bdf8">
    AUTONOMOUS AI COMMAND CENTER
  </text>

  <!-- Title -->
  <text x="70" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="0.3px">
    Nusa-Agent
  </text>

  <!-- External Link Vector Arrow -->
  <g transform="translate(390, 20)">
    <circle cx="10" cy="10" r="12" fill="#1e293b" fill-opacity="0.6" />
    <path d="M6 14L14 6M14 6H8M14 6V12" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Description Lines -->
  <text x="24" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" letter-spacing="0.2px">
    Local-first AI agent command center with multi-agent DAGs,
  </text>
  <text x="24" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" letter-spacing="0.2px">
    zero-trust path sandboxing &amp; Model Context Protocol.
  </text>

  <!-- Status Indicator Badge -->
  <g transform="translate(24, 122)">
    <circle cx="4" cy="4" r="3" fill="#34d399" />
    <text x="13" y="4" dominant-baseline="central" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#34d399" letter-spacing="0.5px">
      ACTIVE v0.1.0
    </text>
  </g>

  <!-- Tech Stack Chips -->
  <g transform="translate(24, 148)">
          <rect width="61.5" height="22" rx="4" fill="#161f30" stroke="#2d3748" stroke-width="0.8" />
          <text x="30.75" y="11" dominant-baseline="central" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8" font-weight="500">FastAPI</text>
        </g><g transform="translate(91.5, 148)">
          <rect width="68.0" height="22" rx="4" fill="#161f30" stroke="#2d3748" stroke-width="0.8" />
          <text x="34.0" y="11" dominant-baseline="central" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8" font-weight="500">Electron</text>
        </g><g transform="translate(165.5, 148)">
          <rect width="48.5" height="22" rx="4" fill="#161f30" stroke="#2d3748" stroke-width="0.8" />
          <text x="24.25" y="11" dominant-baseline="central" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8" font-weight="500">React</text>
        </g><g transform="translate(220.0, 148)">
          <rect width="81.0" height="22" rx="4" fill="#161f30" stroke="#2d3748" stroke-width="0.8" />
          <text x="40.5" y="11" dominant-baseline="central" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8" font-weight="500">SQLite WAL</text>
        </g><g transform="translate(307.0, 148)">
          <rect width="55.0" height="22" rx="4" fill="#161f30" stroke="#2d3748" stroke-width="0.8" />
          <text x="27.5" y="11" dominant-baseline="central" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8" font-weight="500">Python</text>
        </g>
</svg>